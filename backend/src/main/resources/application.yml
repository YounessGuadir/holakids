spring:
  application:
    name: HOLAKIDS
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/holakids}
    username: ${DB_USERNAME:holakids}
    password: ${DB_PASSWORD:holakids_local_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:30000}
      validation-timeout: ${DB_VALIDATION_TIMEOUT_MS:5000}
      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:0}
      idle-timeout: 300000
      max-lifetime: 900000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_batch_fetch_size: 50
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

server:
  # Google Cloud Run injecte automatiquement PORT.
  port: ${PORT:8080}
  address: 0.0.0.0
  shutdown: graceful
  forward-headers-strategy: framework

application:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  jwt:
    secret: ${JWT_SECRET:HOLAKIDS-development-secret-key-change-before-production-2026}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  uploads:
    directory: ${UPLOAD_DIRECTORY:/app/uploads}
  seed:
    enabled: ${SEED_ENABLED:true}
    dataset: ${DATASET_PATH:datasets/products.json}
    admin-email: ${ADMIN_EMAIL:AbdelatifMada@gmail.com}
    # En production, ADMIN_PASSWORD doit être défini dans Cloud Run.
    admin-password: ${ADMIN_PASSWORD:ChangeMeBeforeProduction123!}
    client-email: ${CLIENT_EMAIL:client@holakids.ma}
    client-password: ${CLIENT_PASSWORD:Client@12345}

springdoc:
  packages-to-scan: ma.holakids
  paths-to-match: /api/**
  override-with-generic-response: false
  swagger-ui:
    path: /swagger-ui.html
    disable-swagger-default-url: true
  api-docs:
    path: /v3/api-docs
