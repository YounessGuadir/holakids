name: holakids

services:
  holakids-postgres:
    image: postgres:16-alpine
    container_name: holakids-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-holakids}
      POSTGRES_USER: ${DB_USERNAME:-holakids}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-holakids_local_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - holakids-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks:
      - holakids-network

  holakids-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: holakids-backend
    restart: unless-stopped
    environment:
      PORT: 8080
      DB_URL: "jdbc:postgresql://holakids-postgres:5432/${DB_NAME:-holakids}"
      DB_USERNAME: ${DB_USERNAME:-holakids}
      DB_PASSWORD: ${DB_PASSWORD:-holakids_local_password}
      DB_POOL_MAX_SIZE: ${DB_POOL_MAX_SIZE:-5}
      DB_POOL_MIN_IDLE: ${DB_POOL_MIN_IDLE:-0}
      DDL_AUTO: ${DDL_AUTO:-update}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000}
      JWT_SECRET: ${JWT_SECRET:-HOLAKIDS-local-JWT-secret-change-in-production-2026}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      UPLOAD_DIRECTORY: /app/uploads
      SEED_ENABLED: ${SEED_ENABLED:-true}
      DATASET_PATH: ${DATASET_PATH:-datasets/products.json}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-AbdelatifMada@gmail.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-ChangeMeBeforeProduction123!}
      CLIENT_EMAIL: ${CLIENT_EMAIL:-client@holakids.ma}
      CLIENT_PASSWORD: ${CLIENT_PASSWORD:-Client@12345}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      holakids-postgres:
        condition: service_healthy
    volumes:
      - holakids-uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/v1/health > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 35s
    networks:
      - holakids-network

  holakids-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
    container_name: holakids-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      holakids-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ > /dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - holakids-network

volumes:
  holakids-postgres-data:
    name: holakids-postgres-data
  holakids-uploads:
    name: holakids-uploads

networks:
  holakids-network:
    name: holakids-network
    driver: bridge
